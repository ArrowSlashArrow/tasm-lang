[package]
name = "tasm-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Language server for TASM (Trigger Assembly)"

[dependencies]
# the compiler; the lexer, instruction spec and flag registry are reused from here
tasmc = { path = "../rtasm" }
gdlib = { version = "0.4.3", features = ["parallel"] }
lsp-server = "0.7"
lsp-types = "0.95.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
